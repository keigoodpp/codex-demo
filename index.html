<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f6f7f9;
      color: #20242c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 32px 16px;
    }

    main {
      width: min(720px, 100%);
      display: grid;
      gap: 16px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #dfe3ea;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(32, 36, 44, 0.07);
      overflow: hidden;
    }

    header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid #e8ebf0;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 5vw, 36px);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      font-size: 14px;
      color: #5c6573;
      line-height: 1.5;
    }

    /* 実験ブロック */
    .lab {
      padding: 20px 28px 24px;
    }

    .lab-grid {
      display: grid;
      gap: 16px;
    }

    .lab-block {
      display: grid;
      gap: 6px;
    }

    .lab-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #1f6feb;
    }

    .lab-field {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #c8ced8;
      border-radius: 6px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      color: #20242c;
      background: #fafbfd;
    }

    .lab-field:focus {
      outline: none;
      border-color: #1f6feb;
      background: #fff;
    }

    .lab-save {
      justify-self: end;
      font-size: 13px;
      padding: 8px 14px;
    }

    /* タスクセクション */
    section {
      padding: 24px 28px 28px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8892a0;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      min-width: 0;
      border: 1px solid #c8ced8;
      border-radius: 6px;
      padding: 12px 14px;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #1f6feb;
      cursor: pointer;
    }

    button:hover {
      background: #195fc8;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: #f9fafc;
      border: 1px solid #e3e7ee;
      border-radius: 6px;
    }

    .done span {
      color: #7a8494;
      text-decoration: line-through;
    }

    .ghost {
      color: #6c7480;
      background: #edf1f7;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .actions button {
      width: 38px;
      height: 38px;
      padding: 0;
    }

    .save-notice {
      font-size: 12px;
      color: #1f6feb;
      text-align: right;
      margin-top: 4px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .save-notice.show {
      opacity: 1;
    }

    @media (max-width: 560px) {
      body {
        padding: 16px 12px;
      }

      form {
        grid-template-columns: 1fr;
      }

      header,
      .lab,
      section {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <!-- ヘッダー -->
    <div class="card">
      <header>
        <h1>Codex Demo</h1>
        <p class="subtitle">スマホから AI エージェントへ開発タスクを投げる実験場</p>
      </header>

      <!-- 実験管理ブロック -->
      <div class="lab">
        <div class="lab-grid">
          <div class="lab-block">
            <div class="lab-label">今日の実験</div>
            <textarea id="labExperiment" class="lab-field" rows="2" placeholder="例: localStorage でタスクを永続化する"></textarea>
          </div>
          <div class="lab-block">
            <div class="lab-label">次に投げる指示</div>
            <textarea id="labNextTask" class="lab-field" rows="3" placeholder="例: タスクにメモ欄を追加して。入力は任意で、localStorage に保存すること。"></textarea>
          </div>
          <div class="lab-block">
            <div class="lab-label">完了条件</div>
            <textarea id="labDoneCondition" class="lab-field" rows="2" placeholder="例: GitHub Pages でメモが表示・保存される"></textarea>
          </div>
          <button class="lab-save" id="labSaveBtn" type="button">保存</button>
          <div class="save-notice" id="saveNotice">保存しました</div>
        </div>
      </div>
    </div>

    <!-- タスクリスト -->
    <div class="card">
      <section>
        <div class="section-title">タスク</div>
        <form id="taskForm">
          <input id="taskInput" type="text" placeholder="例: READMEを書く" autocomplete="off">
          <button type="submit">追加</button>
        </form>
        <ul id="taskList" aria-live="polite"></ul>
      </section>
    </div>
  </main>

  <script>
    // --- 実験メモ ---
    const LAB_KEY = "codex-demo-lab";
    const labFields = {
      experiment: document.querySelector("#labExperiment"),
      nextTask: document.querySelector("#labNextTask"),
      doneCondition: document.querySelector("#labDoneCondition"),
    };
    const saveNotice = document.querySelector("#saveNotice");

    function loadLab() {
      try {
        const saved = JSON.parse(localStorage.getItem(LAB_KEY)) || {};
        labFields.experiment.value = saved.experiment || "";
        labFields.nextTask.value = saved.nextTask || "";
        labFields.doneCondition.value = saved.doneCondition || "";
      } catch {}
    }

    function saveLab() {
      localStorage.setItem(LAB_KEY, JSON.stringify({
        experiment: labFields.experiment.value,
        nextTask: labFields.nextTask.value,
        doneCondition: labFields.doneCondition.value,
      }));
      saveNotice.classList.add("show");
      setTimeout(() => saveNotice.classList.remove("show"), 1500);
    }

    document.querySelector("#labSaveBtn").addEventListener("click", saveLab);
    loadLab();

    // --- タスクリスト ---
    const form = document.querySelector("#taskForm");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#taskList");

    const STORAGE_KEY = "codex-demo-tasks";

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultTasks();
      } catch {
        return defaultTasks();
      }
    }

    function defaultTasks() {
      return [
        { text: "最小構成を作る", done: true },
        { text: "ブラウザで動かす", done: false },
        { text: "次の改造を頼んでみる", done: false }
      ];
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    const tasks = loadTasks();

    function render() {
      list.innerHTML = "";

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        item.className = task.done ? "done" : "";

        const label = document.createElement("span");
        label.textContent = task.text;

        const actions = document.createElement("div");
        actions.className = "actions";

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = task.done ? "ghost" : "";
        toggle.textContent = task.done ? "戻" : "済";
        toggle.title = task.done ? "未完了に戻す" : "完了にする";
        toggle.addEventListener("click", () => {
          tasks[index].done = !tasks[index].done;
          saveTasks();
          render();
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "ghost";
        remove.textContent = "削";
        remove.title = "削除";
        remove.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          render();
        });

        actions.append(toggle, remove);
        item.append(label, actions);
        list.append(item);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.unshift({ text, done: false });
      saveTasks();
      input.value = "";
      input.focus();
      render();
    });

    render();
  </script>
</body>
</html>
