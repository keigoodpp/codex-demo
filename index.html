<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Demo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #f6f7f9;
      color: #20242c;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }

    main {
      width: min(720px, 100%);
      background: #ffffff;
      border: 1px solid #dfe3ea;
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(32, 36, 44, 0.10);
      overflow: hidden;
    }

    header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid #e8ebf0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #5c6573;
      line-height: 1.6;
    }

    section {
      padding: 24px 28px 28px;
    }

    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      min-width: 0;
      border: 1px solid #c8ced8;
      border-radius: 6px;
      padding: 12px 14px;
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #1f6feb;
      cursor: pointer;
    }

    button:hover {
      background: #195fc8;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background: #f9fafc;
      border: 1px solid #e3e7ee;
      border-radius: 6px;
    }

    .done span {
      color: #7a8494;
      text-decoration: line-through;
    }

    .ghost {
      color: #6c7480;
      background: #edf1f7;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .actions button {
      width: 38px;
      height: 38px;
      padding: 0;
    }

    @media (max-width: 560px) {
      form {
        grid-template-columns: 1fr;
      }

      header,
      section {
        padding-left: 18px;
        padding-right: 18px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Codex Demo</h1>
      <p>小さなタスクを追加、完了、削除できるだけのテスト用ミニアプリです。</p>
    </header>
    <section>
      <form id="taskForm">
        <input id="taskInput" type="text" placeholder="例: READMEを書く" autocomplete="off">
        <button type="submit">追加</button>
      </form>
      <ul id="taskList" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    const form = document.querySelector("#taskForm");
    const input = document.querySelector("#taskInput");
    const list = document.querySelector("#taskList");

    const STORAGE_KEY = "codex-demo-tasks";

    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultTasks();
      } catch {
        return defaultTasks();
      }
    }

    function defaultTasks() {
      return [
        { text: "最小構成を作る", done: true },
        { text: "ブラウザで動かす", done: false },
        { text: "次の改造を頼んでみる", done: false }
      ];
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    const tasks = loadTasks();

    function render() {
      list.innerHTML = "";

      tasks.forEach((task, index) => {
        const item = document.createElement("li");
        item.className = task.done ? "done" : "";

        const label = document.createElement("span");
        label.textContent = task.text;

        const actions = document.createElement("div");
        actions.className = "actions";

        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = task.done ? "ghost" : "";
        toggle.textContent = task.done ? "戻" : "済";
        toggle.title = task.done ? "未完了に戻す" : "完了にする";
        toggle.addEventListener("click", () => {
          tasks[index].done = !tasks[index].done;
          saveTasks();
          render();
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "ghost";
        remove.textContent = "削";
        remove.title = "削除";
        remove.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          render();
        });

        actions.append(toggle, remove);
        item.append(label, actions);
        list.append(item);
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      tasks.unshift({ text, done: false });
      saveTasks();
      input.value = "";
      input.focus();
      render();
    });

    render();
  </script>
</body>
</html>
